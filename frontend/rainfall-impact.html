<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainfall Impact Analysis | River Flood Forecast</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<main class="container py-3">
<h1>Rainfall Impact Analysis</h1>
<p class="lead-note">How rainfall and river levels move together at each station.</p>
<div class="panel"><label class="form-label" for="station-box">Station</label><input class="form-control" id="station-box" placeholder="Type a station or river name"></div><div class="notice" id="note"></div>
<div class="panel"><h2>Rainfall and river level</h2><div class="chart-box"><canvas id="compare-chart"></canvas></div></div>
<div class="panel"><h2>Accumulated rainfall</h2><div class="chart-box"><canvas id="rolling-chart"></canvas></div></div>
<div class="panel"><h2>Delayed impact: daily rain against level change</h2><div class="chart-box"><canvas id="lag-chart"></canvas></div></div>
<div class="panel"><h2>Correlation heatmap by rain window and delay</h2><div class="table-wrap"><table class="table table-sm heatmap" id="heatmap"></table></div></div>
<div class="panel"><h2>Heavy rain response</h2><p class="mb-0" id="heavy"></p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/impact.js"></script>

</body>
</html>
