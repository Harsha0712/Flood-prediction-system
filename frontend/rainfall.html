<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainfall Forecast | River Flood Forecast</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<main class="container py-3">
<h1>Rainfall Forecast</h1>
<p class="lead-note">Weather API forecasts cover the first few days. The GRU model forecasts the rest.</p>
<div class="panel"><label class="form-label" for="station-box">Station</label><input class="form-control" id="station-box" placeholder="Type a station or river name"></div><div class="notice" id="note"></div>
<div class="panel"><h2>Past and forecast rainfall</h2><div class="chart-box"><canvas id="rain-chart"></canvas></div></div>
<div class="panel"><h2>Daily forecast</h2><div class="table-wrap"><table class="table table-sm"><thead><tr><th>Date</th><th>Rain (mm)</th><th>Source</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/forecast.js"></script>
<script>stationPicker("station-box", showRainfall).catch(() => {});</script>
</body>
</html>
