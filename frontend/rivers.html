<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Rivers and Stations | River Flood Forecast</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<main class="container py-3">
<h1>All Rivers and Stations</h1>
<p class="lead-note">Search every station in the datasets, including those without forecasts.</p>
<div class="panel"><div class="row g-2">
<div class="col-12 col-md-3"><label class="form-label" for="search">Search</label><input class="form-control" id="search" placeholder="River or station"></div>
<div class="col-6 col-md-3"><label class="form-label" for="state">State</label><select class="form-select" id="state"><option value="">All states</option></select></div>
<div class="col-6 col-md-3"><label class="form-label" for="basin">Basin</label><select class="form-select" id="basin"><option value="">All basins</option></select></div>
<div class="col-12 col-md-3"><label class="form-label" for="category">Risk</label><select class="form-select" id="category"><option value="">All categories</option></select></div>
</div></div>
<div class="panel"><p class="small" id="count"></p><div class="table-wrap"><table class="table table-sm"><thead><tr><th>River</th><th>Station</th><th>State</th><th>Basin</th><th>Latest</th><th>Predicted peak</th><th>Trend</th><th>Risk</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/rivers.js"></script>

</body>
</html>
